<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentaciones</title>
<meta name="description" content="Presentaciones interactivas de todos los cursos — UDELAS y Universidad Tecnológica de Panamá.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='24'>◆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#050505; --acc0:#e8d8b0; --dim:rgba(255,255,255,.55); --dimmer:rgba(255,255,255,.32);
    --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:#fff; min-height:100vh;
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    position:relative; overflow-x:hidden;
  }
  .glow{
    position:fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(0);
    background:radial-gradient(circle,rgba(200,25,46,.09) 0%,transparent 60%),
               radial-gradient(circle,rgba(240,192,64,.07) 0%,transparent 60%);
    width:1100px; height:1100px; top:-440px; left:50%; margin-left:-550px;
  }
  .wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:clamp(56px,10vw,120px) clamp(20px,5vw,40px) 80px}

  header{margin-bottom:clamp(48px,7vw,76px)}
  .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    color:var(--acc0); margin-bottom:22px; line-height:1.75;
  }
  .rule{width:58px; height:3px; background:var(--acc0); margin-bottom:26px}
  h1{
    font-family:'Fraunces',Georgia,serif; font-weight:900; letter-spacing:-.03em;
    line-height:1.02; font-size:clamp(42px,8vw,84px); margin:0 0 22px;
  }
  .lede{font-size:clamp(15px,2.2vw,19px); font-weight:300; color:var(--dim); line-height:1.55; max-width:62ch; margin:0}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:20px}

  .card{
    display:flex; flex-direction:column; gap:14px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:32px 30px 28px; position:relative; overflow:hidden;
    transition:transform .34s cubic-bezier(.22,1,.36,1), border-color .34s ease, background .34s ease;
  }
  .card::after{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--acc); opacity:.8; transition:width .34s cubic-bezier(.22,1,.36,1);
  }
  .card:hover{transform:translateY(-5px); border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.06)}
  .card:hover::after{width:6px}
  .card:focus-visible{outline:2px solid var(--acc); outline-offset:3px}

  .sigla{
    font-family:'Fraunces',Georgia,serif; font-weight:900; font-size:15px; letter-spacing:.06em;
    color:var(--acc);
  }
  .card h3{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:27px; margin:0; letter-spacing:-.015em; line-height:1.15}
  .card p{font-size:14.5px; font-weight:300; color:var(--dim); line-height:1.6; margin:0}
  .go{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
    color:var(--acc); margin-top:2px;
  }
  .go svg{transition:transform .32s cubic-bezier(.22,1,.36,1)}
  .card:hover .go svg{transform:translateX(4px)}

  footer{
    margin-top:72px; padding-top:24px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--dimmer); line-height:1.7;
  }

  .reveal{opacity:0; transform:translateY(18px); animation:rise .7s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes rise{to{opacity:1; transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){
    .reveal{animation-duration:.01ms}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="wrap">
  <header class="reveal">
    <div class="eyebrow">Material de apoyo docente</div>
    <div class="rule"></div>
    <h1>Presentaciones</h1>
    <p class="lede">Presentaciones interactivas de los cursos, organizadas por institución. Elige una para ver sus cursos y módulos.</p>
  </header>

  <main class="grid" id="instituciones"></main>

  <footer class="reveal" style="animation-delay:.3s">
    <div>Ing. Bryan Rodríguez S.</div>
  </footer>
</div>

<script>
const ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));

function tarjeta(inst, i) {
  const acc = inst.acento || '#e8d8b0';
  return `<a class="card reveal" href="${esc(inst.id)}/" style="--acc:${acc}; animation-delay:${0.12 + i * 0.09}s">
    <span class="sigla" style="color:${acc}">${esc(inst.nombre)}</span>
    <h3>${esc(inst.nombreCompleto)}</h3>
    <p>${esc(inst.descripcion)}</p>
    <span class="go">Ver cursos ${ICON}</span>
  </a>`;
}

fetch('instituciones.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    document.getElementById('instituciones').innerHTML = data.instituciones.map(tarjeta).join('');
  })
  .catch(err => {
    document.getElementById('instituciones').innerHTML =
      `<div style="border:1px dashed var(--line);border-radius:14px;padding:24px;font-size:14px;color:var(--dimmer)">No se pudo cargar <code>instituciones.json</code> (${esc(err.message)}).</div>`;
  });
</script>
</body>
</html>
