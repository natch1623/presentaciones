<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDELAS · Presentaciones</title>
<meta name="description" content="Presentaciones interactivas de los cursos de Ingeniería Biomédica — UDELAS.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='24'>⚕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#080408; --acc0:#c8192e; --dim:rgba(240,232,232,.55); --dimmer:rgba(240,232,232,.32);
    --card:rgba(240,232,232,.035); --line:rgba(240,232,232,.09);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:#f0e8e8; min-height:100vh;
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    position:relative; overflow-x:hidden;
  }
  .glow{
    position:fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(0);
    background:radial-gradient(circle,rgba(200,25,46,.14) 0%,transparent 70%);
    width:900px; height:900px; top:-380px; left:50%; margin-left:-450px;
  }
  .wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:clamp(48px,8vw,96px) clamp(20px,5vw,40px) 80px}

  header{margin-bottom:clamp(40px,6vw,64px)}
  .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:.2em; text-transform:uppercase;
    color:var(--acc0); margin-bottom:22px; line-height:1.75;
  }
  .rule{width:58px; height:3px; background:var(--acc0); margin-bottom:26px}
  h1{
    font-family:'Cinzel',Georgia,serif; font-weight:900; letter-spacing:-.01em;
    line-height:1.05; font-size:clamp(38px,7vw,68px); margin:0 0 22px;
  }
  .lede{font-size:clamp(15px,2.2vw,19px); font-weight:300; color:var(--dim); line-height:1.55; max-width:60ch; margin:0}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:16px; margin-top:8px}

  .card{
    display:flex; flex-direction:column; gap:10px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:24px 26px 22px; position:relative; overflow:hidden;
    transition:transform .32s cubic-bezier(.22,1,.36,1), border-color .32s ease, background .32s ease;
  }
  .card::after{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--acc); opacity:.75; transition:width .32s cubic-bezier(.22,1,.36,1);
  }
  a.card:hover{transform:translateY(-4px); border-color:rgba(240,232,232,.2); background:rgba(240,232,232,.06)}
  a.card:hover::after{width:5px}
  a.card:focus-visible{outline:2px solid var(--acc); outline-offset:3px}

  .card h3{font-family:'Cinzel',Georgia,serif; font-weight:700; font-size:23px; margin:0; letter-spacing:-.005em}
  .card p{font-size:14px; font-weight:300; color:var(--dim); line-height:1.55; margin:0}
  .go{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
    color:var(--acc); margin-top:4px;
  }
  .go svg{transition:transform .32s cubic-bezier(.22,1,.36,1)}
  a.card:hover .go svg{transform:translateX(4px)}

  .card.pendiente{opacity:.5; cursor:default}

  .vacio{
    border:1px dashed var(--line); border-radius:14px; padding:24px;
    font-size:14px; font-weight:300; color:var(--dimmer); background:rgba(240,232,232,.012);
  }

  .miga{font-size:12.5px; color:var(--dimmer); margin-bottom:18px}
  .miga a{color:var(--dim); text-decoration:none}
  .miga a:hover{color:#fff}

  .reveal{opacity:0; transform:translateY(18px); animation:rise .7s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes rise{to{opacity:1; transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){
    .reveal{animation-duration:.01ms}
    a.card:hover{transform:none}
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="wrap">
  <div class="miga reveal"><a href="../">Presentaciones</a> / UDELAS</div>

  <header class="reveal">
    <div class="eyebrow" id="eyebrow">UDELAS</div>
    <div class="rule"></div>
    <h1 id="titulo">UDELAS</h1>
    <p class="lede" id="lede">Elige un curso para ver sus presentaciones.</p>
  </header>

  <main class="grid" id="cursos"></main>
</div>

<script>
const ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));

function tarjeta(c, i) {
  const acc = c.acento || '#c8192e';
  const meta = `<h3>${esc(c.nombre)}</h3><p>${esc(c.descripcion)}</p>`;
  if (c.estado !== 'disponible') {
    return `<div class="card pendiente reveal" style="--acc:${acc}; animation-delay:${0.1 + i * 0.07}s">
      ${meta}<span class="go" style="color:var(--dimmer)">Próximamente</span></div>`;
  }
  return `<a class="card reveal" href="${esc(c.id)}/" style="--acc:${acc}; animation-delay:${0.1 + i * 0.07}s">
    ${meta}<span class="go">Ver módulos ${ICON}</span></a>`;
}

fetch('cursos.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    document.getElementById('eyebrow').textContent = data.institucion + ' · ' + data.institucionCompleta;
    document.getElementById('titulo').textContent = data.institucion;
    document.getElementById('cursos').innerHTML = data.cursos.length
      ? data.cursos.map(tarjeta).join('')
      : '<div class="vacio">Aún sin cursos publicados.</div>';
  })
  .catch(err => {
    document.getElementById('cursos').innerHTML =
      `<div class="vacio">No se pudo cargar <code>cursos.json</code> (${esc(err.message)}).</div>`;
  });
</script>
</body>
</html>
