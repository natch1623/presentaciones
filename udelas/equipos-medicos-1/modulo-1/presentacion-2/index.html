<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Salida al curso. Vive en el shell, no en la app: cada deck tiene
         su propia arquitectura interna y este enlace no debe depender de
         ninguna. Los decks viven en <curso>/modulo-N/<deck>/, así que dos
         niveles arriba es siempre el índice del curso. -->
    <a id="volver-al-curso" href="../../" title="Volver al curso (Esc)" aria-label="Volver al curso">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      <span>Volver al curso</span>
    </a>
    <style>
      #volver-al-curso{
        position:fixed; top:14px; left:16px; z-index:2147483000;
        display:flex; align-items:center; gap:7px;
        font-family:'Inter',system-ui,sans-serif;
        font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
        color:rgba(255,255,255,.32); text-decoration:none;
        transition:color .25s ease, gap .25s cubic-bezier(.22,1,.36,1);
      }
      #volver-al-curso:hover{ color:#fff; gap:11px; }
      #volver-al-curso:focus-visible{ outline:2px solid currentColor; outline-offset:5px; color:#fff; }
      @media (prefers-reduced-motion: reduce){ #volver-al-curso{ transition:none } }
    </style>
    <script>
      /* Esc sale del deck, pero sólo cuando ya no está saliendo de pantalla
         completa: en fullscreen el navegador se queda con el primer Esc, y
         robárselo sacaría al expositor del proyector y del deck de un golpe. */
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !document.fullscreenElement) {
          window.location.href = '../../'
        }
      })
    </script>

    <!-- figma:body-end -->
  </body>
</html>
